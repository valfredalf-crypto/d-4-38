name: Importa ISIN

# Collega gli ISIN di data/import-requests.json a quotazioni con dati reali (Xetra, ticker del file,
# ricerca Yahoo) e salva il risultato in data/imported-instruments.json; poi il sito si ripubblica.
on:
  push:
    paths: ['data/import-requests.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: import-cache-${{ github.run_id }}
          restore-keys: |
            import-cache-
            universe-cache-
      - run: node scripts/resolve-imports.js
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imported-instruments.json data/import-unresolved.json
          git diff --cached --quiet && echo "Nessuna modifica" && exit 0
          git commit -m "Importa ISIN: $(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/imported-instruments.json")).length)') strumenti"
          git pull --rebase --quiet origin "$GITHUB_REF_NAME"
          git push
