name: Aggiungi o rimuovi ISIN

# Richieste inviate dall'app (pulsante "Aggiungi ISIN") come issue con titolo
# "Aggiungi ISIN <codice>" o "Rimuovi ISIN <codice>". Solo il proprietario del repository può usarle.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      request:
        description: 'Es. "Aggiungi ISIN IE00B4L5Y983"'
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: manage-isin
  cancel-in-progress: false

jobs:
  manage:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, 'Aggiungi ISIN') || startsWith(github.event.issue.title, 'Rimuovi ISIN')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: run
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || inputs.request }}
          RESULT_FILE: ${{ runner.temp }}/esito.md
        run: node scripts/manage-isin.js || echo "failed=true" >> "$GITHUB_OUTPUT"
      - name: Salva
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extra-instruments.json
          git commit -m "Strumenti aggiunti: $(head -c 120 "$RUNNER_TEMP/esito.md" | tr -d '*\n')"
          git push
      - name: Risposta e chiusura
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          [ -f "$RUNNER_TEMP/esito.md" ] || echo "❌ Errore imprevisto: controlla il log dell'esecuzione." > "$RUNNER_TEMP/esito.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/esito.md"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
