name: Pubblica sito (GitHub Pages)

on:
  push:
    branches: [main, claude/trade-republic-monte-carlo-app-ysf7po]
    # Le modifiche a Codex Studio NON devono far ripartire la build di Monte Carlo.
    paths-ignore:
      - 'codex-studio/**'
      - '.github/workflows/codex-pages.yml'
  schedule:
    # Ogni 2 ore: storici e analisti. Quotazioni e previsioni frequenti arrivano da live.yml
    - cron: '23 */2 * * *'
  workflow_run:
    workflows: ['Aggiorna universo strumenti', 'Aggiungi o rimuovi ISIN', 'Importa ISIN', 'Taratura modello']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Storici (validità 12 h) ed evidenze analisti riutilizzati tra un'esecuzione e l'altra:
      # ogni 15 minuti si riscaricano solo le quotazioni.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: market-cache-${{ github.run_id }}
          restore-keys: |
            market-cache-
            live-cache-
            import-cache-
      - run: npm test
      - run: node scripts/build-static.js
      # Regola fissa: l'app si pubblica SOLO se la verifica in un browser vero è superata (nessun errore, tabelle popolate,
      # netto più probabile valido per ogni strumento e periodo, ridisegno rapido, verifica dei dati superata)
      - name: Verifica dell'app prima della pubblicazione
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.52.0
          npx playwright install --with-deps chromium
          node scripts/verify-site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
