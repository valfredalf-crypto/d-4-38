name: Taratura classifica

# Misura sul backtest quale indicatore ordina meglio gli strumenti per il rendimento netto reale a 5 anni.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: rank-cache-${{ github.run_id }}
          restore-keys: |
            live-cache-
            market-cache-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/rank-calibrate.js
      - name: Salva il rapporto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rank-calibration.json
          git diff --cached --quiet && exit 0
          git commit -m "Taratura della classifica dal backtest"
          git pull --rebase --quiet origin "$GITHUB_REF_NAME"
          git push
