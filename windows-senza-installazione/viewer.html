<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Controllo remoto</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#0e1116; color:#e6edf3;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #login { height:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#171c24; border:1px solid #2a333f; border-radius:16px; padding:28px;
    width:100%; max-width:360px; display:flex; flex-direction:column; gap:14px; }
  h1 { margin:0; font-size:20px; }
  .muted { color:#8b98a9; margin:0; font-size:14px; }
  input { background:#0e1116; border:1px solid #2a333f; color:#e6edf3; border-radius:10px;
    padding:12px 14px; font-size:15px; outline:none; }
  input:focus { border-color:#4f8cff; }
  button { background:#4f8cff; color:#fff; border:0; border-radius:10px; padding:12px 16px;
    font-size:15px; font-weight:600; cursor:pointer; }
  .err { color:#ff6b6b; font-size:14px; margin:0; }
  #stage { position:fixed; inset:0; background:#000; display:none; align-items:center; justify-content:center; }
  #stage.on { display:flex; }
  #s { max-width:100%; max-height:100%; width:100%; height:100%; object-fit:contain;
    user-select:none; -webkit-user-drag:none; }
  #bar { position:fixed; top:8px; right:8px; display:none; gap:8px; z-index:5; }
  #bar.on { display:flex; }
  #bar button { background:rgba(23,28,36,.85); border:1px solid #2a333f; padding:6px 10px; font-size:13px; font-weight:500; }
  #tip { position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.6); border:1px solid #2a333f; padding:7px 13px; border-radius:999px;
    font-size:13px; pointer-events:none; transition:opacity .5s; }
  #tip.hide { opacity:0; }
</style>
</head>
<body>
  <div id="login">
    <form class="card" id="f">
      <h1>Controllo remoto</h1>
      <p class="muted">Incolla il token mostrato sul PC da controllare.</p>
      <input id="t" type="password" placeholder="Token" autocomplete="off" />
      <button type="submit">Entra</button>
      <p class="err" id="e" hidden></p>
    </form>
  </div>

  <div id="bar">
    <label style="display:flex;align-items:center;gap:6px;background:rgba(23,28,36,.85);border:1px solid #2a333f;border-radius:10px;padding:6px 10px;font-size:13px;color:#8b98a9;cursor:pointer">
      <input type="checkbox" id="vo" /> Sola visione
    </label>
    <button id="fs">Schermo intero</button>
  </div>

  <div id="stage"><img id="s" alt="schermo remoto" draggable="false" /></div>
  <div id="tip" style="display:none">Clicca e usa mouse + tastiera. Esc va al PC remoto.</div>

<script>
'use strict';
var T = '';
var FPS = 6;
var running = false;
var queue = [];
var sending = false;

var img = document.getElementById('s');
var stage = document.getElementById('stage');
var bar = document.getElementById('bar');
var tip = document.getElementById('tip');

document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault();
  T = document.getElementById('t').value.trim();
  document.getElementById('e').hidden = true;
  fetch('/ping?token=' + encodeURIComponent(T)).then(function (r) {
    if (!r.ok) throw 0;
    start();
  }).catch(function () {
    var e = document.getElementById('e'); e.textContent = 'Token sbagliato.'; e.hidden = false;
  });
});

function start() {
  running = true;
  document.getElementById('login').style.display = 'none';
  stage.classList.add('on'); bar.classList.add('on');
  tip.style.display = ''; setTimeout(function(){ tip.classList.add('hide'); }, 4000);
  loop();
  setInterval(flush, 40);
}

function loop() {
  fetch('/frame?token=' + encodeURIComponent(T) + '&_=' + Date.now()).then(function (r) {
    if (!r.ok) throw 0; return r.blob();
  }).then(function (b) {
    var u = URL.createObjectURL(b);
    var old = img.src;
    img.onload = function () { if (old && old.indexOf('blob:') === 0) URL.revokeObjectURL(old); };
    img.src = u;
  }).catch(function () {}).then(function () {
    if (running) setTimeout(loop, 1000 / FPS);
  });
}

function enabled() { return running && !document.getElementById('vo').checked; }

function norm(ev) {
  var r = img.getBoundingClientRect();
  var nw = img.naturalWidth || r.width, nh = img.naturalHeight || r.height;
  var sc = Math.min(r.width / nw, r.height / nh);
  var w = nw * sc, h = nh * sc;
  var ox = r.left + (r.width - w) / 2, oy = r.top + (r.height - h) / 2;
  var x = (ev.clientX - ox) / w, y = (ev.clientY - oy) / h;
  return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
}
function push(e, imm) { queue.push(e); if (imm) flush(); }
function flush() {
  if (!queue.length || sending) return;
  sending = true; var ev = queue; queue = [];
  fetch('/input?token=' + encodeURIComponent(T), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ events: ev })
  }).catch(function () {}).then(function () { sending = false; });
}

var BTN = { 0: 'left', 1: 'middle', 2: 'right' };
stage.addEventListener('pointermove', function (e) { if (enabled()) { var n = norm(e); push({ t: 'move', x: n.x, y: n.y }, false); } });
stage.addEventListener('pointerdown', function (e) {
  if (!enabled()) return; e.preventDefault();
  if (stage.setPointerCapture) stage.setPointerCapture(e.pointerId);
  var n = norm(e); push({ t: 'down', button: BTN[e.button] || 'left', x: n.x, y: n.y }, true);
});
stage.addEventListener('pointerup', function (e) {
  if (!enabled()) return; e.preventDefault();
  var n = norm(e); push({ t: 'up', button: BTN[e.button] || 'left', x: n.x, y: n.y }, true);
});
stage.addEventListener('contextmenu', function (e) { if (enabled()) e.preventDefault(); });
stage.addEventListener('wheel', function (e) {
  if (!enabled()) return; e.preventDefault();
  var n = norm(e); push({ t: 'scroll', dir: e.deltaY < 0 ? 'up' : 'down', x: n.x, y: n.y }, true);
}, { passive: false });

window.addEventListener('keydown', function (e) {
  if (!enabled()) return;
  if (e.key === 'F5' || e.key === 'F11' || e.key === 'F12') return;
  e.preventDefault();
  var printable = e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey;
  if (printable) push({ t: 'type', text: e.key }, true);
  else push({ t: 'key', key: e.key, mods: { ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey } }, true);
}, true);

document.getElementById('fs').addEventListener('click', function () {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (stage.requestFullscreen) stage.requestFullscreen();
});
</script>
</body>
</html>
